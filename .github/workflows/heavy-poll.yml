name: Heavy poll (snapshot + diff + prune)

on:
  # Trigger.dev owns the production schedule (see src/trigger/polls.ts). Keep
  # this commented so workflow_dispatch remains a manually runnable fallback.
  # schedule:
  #   - cron: "7 */8 * * *"
  workflow_dispatch:

concurrency:
  group: heavy-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger worker snapshot
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "x-admin-token: ${{ secrets.ADMIN_TOKEN }}" \
            https://stats.ussego.com/api/admin/snapshot
