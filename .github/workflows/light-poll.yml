name: Light poll (new plugin count)

on:
  # Trigger.dev owns the production schedule (see src/trigger/polls.ts). Keep
  # this commented so workflow_dispatch remains a manually runnable fallback.
  # schedule:
  #   - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: light-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger worker light poll
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "x-admin-token: ${{ secrets.ADMIN_TOKEN }}" \
            https://stats.ussego.com/api/admin/light-poll
